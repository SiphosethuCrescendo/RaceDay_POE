name: Validate Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check docs folder exists
      run: |
        if [ ! -d "docs" ]; then
          echo "❌ docs folder is missing!"
          exit 1
        else
          echo "✅ docs folder exists"
        fi
    
    - name: Check ERD file exists
      run: |
        if [ ! -f "docs/ERD_RaceDay.png" ] && [ ! -f "docs/ERD_RaceDay.pdf" ]; then
          echo "❌ ERD file missing! Looking for ERD_RaceDay.png or ERD_RaceDay.pdf"
          exit 1
        else
          echo "✅ ERD file found"
        fi
    
    - name: Check API Endpoint Plan exists
      run: |
        if [ ! -f "docs/API_Endpoint_Plan.md" ] && [ ! -f "docs/API_Endpoint_Plan.pdf" ]; then
          echo "❌ API Endpoint Plan missing!"
          exit 1
        else
          echo "✅ API Endpoint Plan found"
        fi
    
    - name: Check SQL Script exists
      run: |
        if [ ! -f "docs/RaceDay_Database.sql" ]; then
          echo "❌ SQL script missing!"
          exit 1
        else
          echo "✅ SQL script found"
        fi
    
    - name: Check README exists
      run: |
        if [ ! -f "README.md" ]; then
          echo "❌ README.md missing!"
          exit 1
        else
          echo "✅ README.md found"
        fi
    
    - name: Validate SQL syntax (basic)
      run: |
        if [ -f "docs/RaceDay_Database.sql" ]; then
          # Basic validation - check for CREATE TABLE statements
          if grep -q "CREATE TABLE" docs/RaceDay_Database.sql; then
            echo "✅ SQL contains CREATE TABLE statements"
          else
            echo "⚠️ No CREATE TABLE statements found in SQL file"
          fi
          
          # Check for INSERT statements
          if grep -q "INSERT INTO" docs/RaceDay_Database.sql; then
            echo "✅ SQL contains INSERT statements"
          else
            echo "⚠️ No INSERT statements found in SQL file"
          fi
        fi
    
    - name: List docs directory
      run: |
        echo "📁 Contents of docs folder:"
        ls -la docs/
    
    - name: Validation Summary
      run: |
        echo "✅ All documentation validation checks passed!"
        echo ""
        echo "📋 Documentation Status:"
        echo "   📄 ERD: $(if [ -f docs/ERD_RaceDay.png ] || [ -f docs/ERD_RaceDay.pdf ]; then echo '✅ Found'; else echo '❌ Missing'; fi)"
        echo "   📄 API Endpoint Plan: $(if [ -f docs/API_Endpoint_Plan.md ] || [ -f docs/API_Endpoint_Plan.pdf ]; then echo '✅ Found'; else echo '❌ Missing'; fi)"
        echo "   📄 SQL Script: $(if [ -f docs/RaceDay_Database.sql ]; then echo '✅ Found'; else echo '❌ Missing'; fi)"
        echo "   📄 README: $(if [ -f README.md ]; then echo '✅ Found'; else echo '❌ Missing'; fi)"
